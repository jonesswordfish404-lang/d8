<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#202020">
<title>D8 · MP3 → MP4 (Fast)</title>
<style>
  :root{
    --bg:#202020; --panel:#2d2d30; --panel2:#262629;
    --cyan:#0096C8; --blue:#375AD2; --violet:#7846D2;
    --text:gainsboro; --muted:#8a8a90; --line:#3a3a3f;
    --ok:#3ecb7a; --warn:#e6b54a; --err:#e05555;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    font-size:15px;line-height:1.45;padding:16px 14px 40px;
    max-width:560px;margin:0 auto;min-height:100vh;
  }
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--cyan),var(--blue) 55%,var(--violet));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;color:#fff;letter-spacing:-1px;
    box-shadow:0 4px 14px rgba(55,90,210,.35);
  }
  h1{font-size:18px;margin:0;font-weight:600}
  .sub{font-size:12px;color:var(--muted);margin-top:1px}

  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
    padding:5px 10px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted);margin-bottom:14px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)}
  .spin{width:9px;height:9px;border:2px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .card h2{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

  .drop{
    display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px dashed var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s;
  }
  .drop:active{border-color:var(--cyan)}
  .drop.filled{border-style:solid;border-color:var(--cyan)}
  .drop .ico{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-size:18px}
  .drop .meta{min-width:0}
  .drop .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drop .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  input[type=file]{display:none}

  .previewWrap{margin-top:12px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  #preview{width:100%;height:100%;display:block}
  .previewEmpty{color:var(--muted);font-size:12.5px}

  .opt-row{margin-bottom:14px}.opt-row:last-child{margin-bottom:0}
  .opt-label{font-size:12.5px;color:var(--muted);margin-bottom:7px}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;background:transparent;color:var(--muted);border:0;padding:9px 4px;font-size:13px;font-family:inherit;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;font-weight:600}

  .go{width:100%;border:0;border-radius:12px;padding:15px;font-family:inherit;font-size:16px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--blue) 55%,var(--violet));box-shadow:0 4px 16px rgba(120,70,210,.3);transition:opacity .15s,transform .05s}
  .go:active{transform:translateY(1px)}
  .go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  .progWrap{margin-top:14px;display:none}.progWrap.show{display:block}
  .segbar{display:flex;gap:3px;height:14px;margin-bottom:8px}
  .segbar i{flex:1;border-radius:3px;background:var(--panel2);transition:background .2s}
  .segbar i.fill{background:linear-gradient(90deg,var(--cyan),var(--violet))}
  .progText{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

  .result{display:none;margin-top:6px}.result.show{display:block}
  .result video{width:100%;border-radius:12px;background:#000;margin-bottom:12px;display:block}
  .dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;text-align:center;border-radius:12px;padding:14px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ok),#2a9e5f)}

  .status{font-size:12.5px;margin-top:10px;color:var(--muted);min-height:16px}
  .status.err{color:var(--err)}.status.warn{color:var(--warn)}.status.ok{color:var(--ok)}
  footer{text-align:center;font-size:11px;color:#555;margin-top:22px}
</style>
</head>
<body>

<header>
  <div class="logo">D8</div>
  <div>
    <h1>MP3 → MP4</h1>
    <div class="sub">Still image + audio · faster‑than‑real‑time</div>
  </div>
</header>

<div class="chip" id="engineChip"><span class="spin" id="engineDot"></span><span id="engineLabel">Loading engine…</span></div>

<div class="card">
  <h2>Sources</h2>
  <label class="drop" id="dropAudio" for="audioIn">
    <div class="ico">♪</div>
    <div class="meta"><div class="t" id="audioName">Choose audio</div><div class="d" id="audioDesc">MP3, M4A, WAV, OGG…</div></div>
  </label>
  <input type="file" id="audioIn" accept="audio/*">

  <label class="drop" id="dropImage" for="imageIn" style="margin-top:10px">
    <div class="ico">▦</div>
    <div class="meta"><div class="t" id="imageName">Choose image</div><div class="d" id="imageDesc">JPG, PNG, WebP…</div></div>
  </label>
  <input type="file" id="imageIn" accept="image/*">

  <div class="previewWrap">
    <span class="previewEmpty" id="previewEmpty">Preview</span>
    <canvas id="preview" style="display:none"></canvas>
  </div>
</div>

<div class="card">
  <h2>Options</h2>
  <div class="opt-row">
    <div class="opt-label">Image fit</div>
    <div class="seg" id="fitSeg">
      <button data-fit="contain" class="on">Fit (letterbox)</button>
      <button data-fit="cover">Fill (crop)</button>
    </div>
  </div>
  <div class="opt-row">
    <div class="opt-label">Resolution</div>
    <div class="seg" id="resSeg">
      <button data-res="720" class="on">720p</button>
      <button data-res="1080">1080p</button>
    </div>
  </div>
  <div class="opt-row">
    <div class="opt-label">Frame background (letterbox)</div>
    <div class="seg" id="bgSeg">
      <button data-bg="202020" class="on">D8 dark</button>
      <button data-bg="000000">Black</button>
      <button data-bg="ffffff">White</button>
    </div>
  </div>
</div>

<div class="card">
  <button class="go" id="goBtn" disabled>Render MP4</button>
  <div class="progWrap" id="progWrap">
    <div class="segbar" id="segbar"></div>
    <div class="progText"><span id="progLabel">Rendering…</span><span id="progTime">0%</span></div>
  </div>
  <div class="status" id="status"></div>
  <div class="result" id="result">
    <video id="resultVideo" controls playsinline></video>
    <a class="dl" id="dlLink" download>⬇ Save video</a>
  </div>
</div>

<footer>D8 · Digital8Dreamz · renders locally, nothing uploaded</footer>

<script type="module">
import { FFmpeg }               from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { toBlobURL, fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const $ = id => document.getElementById(id);

const state = { audioFile:null, imageFile:null, imageBitmap:null, audioBuffer:null,
  fit:"contain", res:720, bg:"202020", busy:false };
let ffmpeg=null, engineReady=false;

const audioIn=$("audioIn"), imageIn=$("imageIn"), dropAudio=$("dropAudio"), dropImage=$("dropImage");
const audioName=$("audioName"), audioDesc=$("audioDesc"), imageName=$("imageName"), imageDesc=$("imageDesc");
const previewCanvas=$("preview"), previewEmpty=$("previewEmpty");
const goBtn=$("goBtn"), statusEl=$("status");
const progWrap=$("progWrap"), segbar=$("segbar"), progLabel=$("progLabel"), progTime=$("progTime");
const result=$("result"), resultVideo=$("resultVideo"), dlLink=$("dlLink");
const engineDot=$("engineDot"), engineLabel=$("engineLabel");

const fmt = s => { s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60),ss=String(s%60).padStart(2,"0"); return m+":"+ss; };
const setStatus = (m,c="") => { statusEl.textContent=m; statusEl.className="status"+(c?" "+c:""); };

const SEGS=24;
for(let i=0;i<SEGS;i++) segbar.appendChild(document.createElement("i"));
const setProgress = f => { const n=Math.round(Math.min(1,Math.max(0,f))*SEGS); const k=segbar.children; for(let i=0;i<SEGS;i++) k[i].classList.toggle("fill", i<n); };

function setEngine(kind, msg){
  if(kind==="fast"){ engineDot.className="dot on"; engineLabel.textContent=msg||"Fast engine ready (ffmpeg)"; }
  else if(kind==="fallback"){ engineDot.className="dot off"; engineLabel.textContent=msg||"Fallback: real‑time recorder"; }
  else { engineDot.className="spin"; engineLabel.textContent=msg||"Loading engine…"; }
}

(async () => {
  // The fast engine needs a real HTTP(S) origin. A double-clicked file (file://)
  // has no origin and the worker can't start — skip straight to real-time.
  if(location.protocol === "file:"){
    engineReady=false;
    setEngine("fallback","Real‑time mode — host it for fast MP4");
    setStatus("The fast engine needs a web server (GitHub Pages) or localhost — not a double‑clicked file. Real‑time rendering still works here.","warn");
    return;
  }

  setEngine("loading","Downloading engine (~30 MB, first run)…");

  const doLoad = async () => {
    ffmpeg = new FFmpeg();
    ffmpeg.on("log", ({message}) => console.log("[ffmpeg]", message));
    const core = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";
    const wrap = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm";
    const [coreURL, wasmURL, workerURL] = await Promise.all([
      toBlobURL(`${core}/ffmpeg-core.js`,   "text/javascript"),
      toBlobURL(`${core}/ffmpeg-core.wasm`, "application/wasm"),
      toBlobURL(`${wrap}/worker.js`,        "text/javascript"),
    ]);
    await ffmpeg.load({ coreURL, wasmURL, classWorkerURL: workerURL });
  };

  // Guard against a silent hang (worker never signals ready) or a stalled download.
  const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("load timed out after 60s")), 60000));

  try{
    await Promise.race([doLoad(), timeout]);
    ffmpeg.on("progress", ({progress}) => {
      if(!state.busy) return;
      const p = Math.min(1, Math.max(0, progress||0));
      setProgress(p); progTime.textContent = Math.round(p*100)+"%";
    });
    engineReady=true; setEngine("fast");
  }catch(err){
    engineReady=false;
    setEngine("fallback","Real‑time mode (fast engine unavailable)");
    setStatus("Fast engine didn't load ("+(err&&err.message?err.message:err)+") — using real‑time fallback. This is expected inside the in‑app preview; it runs fast once hosted or on localhost.","warn");
    console.warn("ffmpeg load failed:", err);
  }
})();

function wireSeg(id, attr, cb){
  const w=$(id);
  w.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
    [...w.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); cb(b.getAttribute(attr)); });
}
wireSeg("fitSeg","data-fit", v=>{ state.fit=v; drawPreview(); });
wireSeg("resSeg","data-res", v=>{ state.res=parseInt(v,10); drawPreview(); });
wireSeg("bgSeg","data-bg", v=>{ state.bg=v; drawPreview(); });

audioIn.addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  state.audioFile=f; state.audioBuffer=null;
  audioName.textContent=f.name; audioDesc.textContent="Decoding…"; dropAudio.classList.add("filled");
  try{
    const buf=await f.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
    const dec=await ctx.decodeAudioData(buf.slice(0)); ctx.close();
    state.audioBuffer=dec;
    audioDesc.textContent=fmt(dec.duration)+" · "+dec.numberOfChannels+"ch · "+Math.round(f.size/1024)+" KB";
    setStatus("");
  }catch(err){ audioDesc.textContent="Could not decode"; setStatus("Audio decode failed — try MP3/M4A/WAV.","err"); }
  refreshReady();
});

imageIn.addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  state.imageFile=f; imageName.textContent=f.name; imageDesc.textContent="Loading…"; dropImage.classList.add("filled");
  try{
    if(state.imageBitmap && state.imageBitmap.close) state.imageBitmap.close();
    let bmp;
    if(window.createImageBitmap) bmp=await createImageBitmap(f);
    else bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f);});
    state.imageBitmap=bmp;
    const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight;
    imageDesc.textContent=w+"×"+h+" · "+Math.round(f.size/1024)+" KB";
    drawPreview(); setStatus("");
  }catch(err){ imageDesc.textContent="Could not load"; setStatus("Image load failed — try JPG/PNG.","err"); }
  refreshReady();
});

function frameDims(){ const H=state.res, W=Math.round(H*16/9); return {W,H}; }
function drawFrame(ctx,W,H){
  ctx.fillStyle="#"+state.bg; ctx.fillRect(0,0,W,H);
  const bmp=state.imageBitmap; if(!bmp) return;
  const iw=bmp.width||bmp.naturalWidth, ih=bmp.height||bmp.naturalHeight;
  const scale = state.fit==="cover" ? Math.max(W/iw,H/ih) : Math.min(W/iw,H/ih);
  const dw=iw*scale, dh=ih*scale;
  ctx.drawImage(bmp,(W-dw)/2,(H-dh)/2,dw,dh);
}
function drawPreview(){
  if(!state.imageBitmap){ previewCanvas.style.display="none"; previewEmpty.style.display=""; return; }
  const {W,H}=frameDims(); previewCanvas.width=W; previewCanvas.height=H;
  previewCanvas.style.display="block"; previewEmpty.style.display="none";
  drawFrame(previewCanvas.getContext("2d"),W,H);
}
function refreshReady(){ goBtn.disabled = !(state.audioBuffer && state.imageBitmap) || state.busy; }

goBtn.addEventListener("click", async ()=>{
  if(state.busy || !(state.audioBuffer && state.imageBitmap)) return;
  state.busy=true; refreshReady(); goBtn.textContent="Rendering…";
  result.classList.remove("show"); progWrap.classList.add("show"); setProgress(0); progTime.textContent="0%"; setStatus("");
  try{
    if(engineReady) await renderFast();
    else await renderRealtime();
  }catch(err){
    setStatus("Render failed: "+(err&&err.message?err.message:err),"err");
    progWrap.classList.remove("show");
  }finally{
    state.busy=false; goBtn.textContent="Render MP4"; refreshReady();
  }
});

async function renderFast(){
  progLabel.textContent="Rendering (fast)…";
  const {W,H}=frameDims();
  const bg="0x"+state.bg;
  const vf = state.fit==="cover"
    ? `scale=${W}:${H}:force_original_aspect_ratio=increase,crop=${W}:${H}`
    : `scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(${W}-iw)/2:(${H}-ih)/2:${bg}`;

  const imgExt = (state.imageFile.type.split("/")[1]||"jpg").replace("jpeg","jpg");
  const audExt = ((state.audioFile.type.split("/")[1]||"mp3").split(";")[0]) || "mp3";
  const imgName="in_img."+imgExt, audName="in_aud."+audExt, outName="out.mp4";

  await ffmpeg.writeFile(imgName, await fetchFile(state.imageFile));
  await ffmpeg.writeFile(audName, await fetchFile(state.audioFile));

  await ffmpeg.exec([
    "-loop","1","-framerate","5","-i",imgName,
    "-i",audName,
    "-vf",vf,
    "-c:v","libx264","-tune","stillimage","-preset","veryfast","-pix_fmt","yuv420p","-r","5",
    "-c:a","aac","-b:a","192k",
    "-shortest","-movflags","+faststart", outName
  ]);

  const data = await ffmpeg.readFile(outName);
  finish(new Blob([data.buffer], {type:"video/mp4"}), "mp4");
  try{ await ffmpeg.deleteFile(imgName); await ffmpeg.deleteFile(audName); await ffmpeg.deleteFile(outName); }catch(_){}
}

async function renderRealtime(){
  progLabel.textContent="Rendering in real time…";
  const types=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm"];
  let mime="", ext="webm";
  for(const t of types){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t)){ mime=t; ext=t.includes("mp4")?"mp4":"webm"; break; } }
  if(ext==="webm") setStatus("This device won't record MP4 — saving WebM (D8Engine can remux).","warn");

  let wakeLock=null; try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request("screen"); }catch(_){}
  const {W,H}=frameDims();
  const canvas=document.createElement("canvas"); canvas.width=W; canvas.height=H;
  const cctx=canvas.getContext("2d"); drawFrame(cctx,W,H);
  const vStream=canvas.captureStream(15);

  const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC(); if(ctx.state==="suspended") await ctx.resume();
  const src=ctx.createBufferSource(); src.buffer=state.audioBuffer;
  const dest=ctx.createMediaStreamDestination(); src.connect(dest);
  const mixed=new MediaStream([...vStream.getVideoTracks(),...dest.stream.getAudioTracks()]);

  const opts={videoBitsPerSecond:2_000_000,audioBitsPerSecond:192_000}; if(mime) opts.mimeType=mime;
  const rec=new MediaRecorder(mixed,opts); const chunks=[];
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const dur=state.audioBuffer.duration, start=ctx.currentTime; let raf=0;
  const tick=()=>{ drawFrame(cctx,W,H); const el=ctx.currentTime-start; setProgress(el/dur); progTime.textContent=Math.round(el/dur*100)+"%"; raf=requestAnimationFrame(tick); };
  const done=new Promise((res,rej)=>{ rec.onstop=res; rec.onerror=e=>rej(e.error||new Error("Recorder error")); });
  rec.start(1000); src.start(); raf=requestAnimationFrame(tick);
  src.onended=()=>setTimeout(()=>{ if(rec.state!=="inactive") rec.stop(); },250);
  await done; cancelAnimationFrame(raf);
  try{ if(ctx.state!=="closed") ctx.close(); }catch(_){}
  try{ if(wakeLock) await wakeLock.release(); }catch(_){}
  finish(new Blob(chunks,{type:mime||("video/"+ext)}), ext);
}

function finish(blob, ext){
  const url=URL.createObjectURL(blob);
  const base=(state.audioFile.name.replace(/\.[^.]+$/,""))||"output";
  const fname=base+"_D8."+ext;
  resultVideo.src=url; dlLink.href=url; dlLink.download=fname; dlLink.textContent="⬇ Save "+fname;
  result.classList.add("show");
  setProgress(1); progTime.textContent="100%"; progLabel.textContent="Done";
  setStatus("Rendered "+fname+" · "+(blob.size/1048576).toFixed(1)+" MB · "+ext.toUpperCase(),"ok");
}
</script>
</body>
</html>
